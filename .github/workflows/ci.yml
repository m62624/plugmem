name: CI

on:
  # Push CI runs only on the default branch (post-merge validation). Feature
  # branches are covered by the pull_request event below, so a branch with an
  # open PR is not built twice (one push run + one PR run racing each other).
  # rc/v* release branches run through workflow_call, not this trigger.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "crates/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
  # No paths filter on PRs on purpose: the branch-protection gate (`ci-pass`
  # below) is a *required* check, so it must ALWAYS report. With a paths filter
  # a docs-only PR would never start the workflow and the required check would
  # hang forever ("Expected — waiting for status"). CI is cached and cheap, so
  # we just let it run on every PR.
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: false
        type: string
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

# Runtime versions for the wasm execution jobs. Pinned to the versions the
# cross-target equivalence was validated against (specs/14 §3); bump by hand
# together with a fresh local validation run.
env:
  WASMTIME_VERSION: "v41.0.3"
  WASMER_VERSION: "v7.2.0"
  # Property tests search, they do not assert. Proptest seeds each search from
  # OS entropy by default, so the ~26 `proptest!` properties across this matrix
  # explored a different slice of their input space in every job of every run —
  # several hundred fresh searches per push. A latent bug anywhere in that space
  # then surfaced as a red build on an unrelated commit (docs-only pushes have
  # gone red this way), with no way to reproduce it: the seed died with the job.
  #
  # Pinning the seed makes CI answer a question about the commit instead of
  # about the dice. The searches are unchanged in size — they are simply the
  # same searches every time, on every OS, and reproducible locally with the
  # same variable. New ground is covered by property-search.yml, on a schedule,
  # where a find is reported with the seed that produced it rather than
  # blocking a release.
  PROPTEST_RNG_SEED: "20250804"

jobs:
  # --- formatting ------------------------------------------------------------
  # Formatting and documentation are deterministic and platform-independent, so
  # they run once here instead of repeating in every OS/feature job below.
  format:
    name: formatting + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      # `bench-charts` pulls plotters, which needs system fontconfig to build.
      # The matrix jobs below install it for the same reason.
      - name: System deps for the chart tool
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      # rustdoc's own diagnostics, which nothing ran before: `cargo doc` was in
      # no workflow, so a broken doc link sat in the tree unnoticed (it did —
      # `bench-charts` failed to document at all). Doctests are deliberately
      # *not* repeated here: every matrix job below runs `cargo test`, which
      # already includes them, and the crate READMEs are part of that through
      # `#![doc = include_str!("../README.md")]`.
      #
      # `-D warnings` because a link to a private item renders as plain text on
      # docs.rs and is invisible locally. `broken_intra_doc_links` is already
      # denied in `[workspace.lints]`; this makes the private-link case as loud.
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

  # --- linter + tests, fanned out across OSes and feature profiles -----------
  # Each feature profile is its own matrix entry, so the three independent
  # cargo checks no longer run sequentially inside one OS job. The default,
  # counters, and serde profiles run on every OS; the combined all-features
  # interaction profile runs once on Linux because it is not OS-specific.
  #
  # Features change which code compiles (specs/07 §8: clippy on one combo does
  # not cover the others). `counters` enables deterministic perf gates and
  # `serde` enables Serialize/Deserialize derives. The host's `config` feature
  # is on by default and is also pulled in explicitly by the CLI, MCP, and NAPI
  # packages. (There is no `std` feature: the core and arena are `no_std`
  # unconditionally; the real no_std gate is the wasm32v1-none build job below.)

  check:
    name: lint + test (${{ matrix.os_name }}, ${{ matrix.feature_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os_name: Linux, os: ubuntu-latest, feature_name: default, feature_args: "" }
          - { os_name: Linux, os: ubuntu-latest, feature_name: counters, feature_args: "--features counters" }
          - { os_name: Linux, os: ubuntu-latest, feature_name: serde, feature_args: "--features serde" }
          - { os_name: Linux, os: ubuntu-latest, feature_name: all-features, feature_args: "--all-features" }
          - { os_name: Windows, os: windows-latest, feature_name: default, feature_args: "" }
          - { os_name: Windows, os: windows-latest, feature_name: counters, feature_args: "--features counters" }
          - { os_name: Windows, os: windows-latest, feature_name: serde, feature_args: "--features serde" }
          - { os_name: macOS, os: macos-latest, feature_name: default, feature_args: "" }
          - { os_name: macOS, os: macos-latest, feature_name: counters, feature_args: "--features counters" }
          - { os_name: macOS, os: macos-latest, feature_name: serde, feature_args: "--features serde" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # `--workspace` includes plugmem-py, and PyO3 links libpython for
      # anything that is not the extension module itself — the rlib these jobs
      # lint and test, and the `stub_gen` binary. Runners ship an interpreter,
      # but not always with the development layout PyO3's build script looks
      # for, and it differs per OS. Asking for one explicitly keeps the matrix
      # full on all three: narrowing it to skip the crate would mean the
      # binding is linted on Linux only.
      - uses: actions/setup-python@v6
        with:
          # The floor `abi3-py310` targets, so the workspace builds against the
          # same interpreter the shipped wheel is built against.
          python-version: "3.10"
      # The bench-charts dev tool (plotters → font-kit) needs system
      # fontconfig at build time on Linux; the shipped crates do not.
      # macOS/Windows resolve system fonts without it.
      - name: System deps for the chart tool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Clippy (${{ matrix.feature_name }})
        run: cargo clippy --workspace --all-targets ${{ matrix.feature_args }} -- -D warnings
      - name: Tests (${{ matrix.feature_name }})
        run: cargo test --workspace ${{ matrix.feature_args }}

  # Fuzzing the two untrusted files: a snapshot and a journal are bytes on disk
  # that anything could have written, and a crash can truncate the journal
  # mid-record. The engine's read accessors panic on contract violations by
  # design; what makes that sound is the load path range-checking every
  # persisted id first, so the strength of that argument is exactly the
  # strength of the checking — and these targets attack the checking.
  #
  # One runner, no OS matrix: this exercises format parsing, which is
  # endianness-explicit and platform-independent, so a second OS would re-run
  # identical work. The three targets share the job because installing
  # cargo-fuzz costs more than running them. Short bounded runs seeded from the
  # committed corpus of real images — enough to catch a regression on a PR;
  # a real campaign is a manual long run, not something every push pays for.
  fuzz:
    name: fuzz (snapshot + journal parsers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz the parsers
        # `-rss_limit_mb` turns a memory blow-up from a malformed header into a
        # reported finding instead of a hung runner.
        run: |
          for target in snapshot_open journal_replay snapshot_scrub; do
            echo "::group::$target"
            # The corpus directory is the fuzzer's own working set and is not
            # in git, so a fresh checkout has to create it. The committed
            # seeds go second, read-only: libFuzzer writes new finds into the
            # first directory only, so a run never rewrites what is tracked.
            mkdir -p "fuzz/corpus/$target"
            cargo +nightly fuzz run "$target" \
              "fuzz/corpus/$target" "fuzz/seeds/$target" -- \
              -max_total_time=60 -rss_limit_mb=4096
            echo "::endgroup::"
          done
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

  # --- portability checks, in parallel with the lint+test matrix above -------

  no_std:
    name: no_std build (wasm32v1-none, ${{ matrix.feature_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { feature_name: default, feature_args: "" }
          - { feature_name: counters, feature_args: "--features counters" }
          - { feature_name: serde, feature_args: "--features serde" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build libraries for a real no_std target (${{ matrix.feature_name }})
        run: >-
          cargo build -p plugmem-arena -p plugmem-core
          ${{ matrix.feature_args }} --target wasm32v1-none

  # The whole contract test suite of the core, executed on a REAL 32-bit
  # target under both independent wasm runtimes and each feature profile. This
  # is what caught the 32-bit journal allocation abort
  # (specs/14 §5) that native 64-bit CI can never see. proptest sections are
  # native-only (gated in the test files); everything else runs.
  wasm-suite:
    name: core+arena suites on wasm32 (${{ matrix.runtime }}, ${{ matrix.feature_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runtime: wasmtime, feature_name: default, feature_args: "" }
          - { runtime: wasmtime, feature_name: counters, feature_args: "--features counters" }
          - { runtime: wasmtime, feature_name: serde, feature_args: "--features serde" }
          - { runtime: wasmer, feature_name: default, feature_args: "" }
          - { runtime: wasmer, feature_name: counters, feature_args: "--features counters" }
          - { runtime: wasmer, feature_name: serde, feature_args: "--features serde" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Install wasmtime
        if: matrix.runtime == 'wasmtime'
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version ${{ env.WASMTIME_VERSION }}
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_WASM32_WASIP1_RUNNER=wasmtime run --dir=." >> "$GITHUB_ENV"
      - name: Install wasmer
        if: matrix.runtime == 'wasmer'
        run: |
          curl https://get.wasmer.io -sSfL | sh -s ${{ env.WASMER_VERSION }}
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_WASM32_WASIP1_RUNNER=wasmer run" >> "$GITHUB_ENV"
      - name: Run the core suite on wasm32
        # Release: the torn-tail/bitflip matrices are byte-loops that crawl in
        # a debug interpreter-free JIT but still add minutes; release keeps the
        # whole suite in seconds.
        run: cargo test --release -p plugmem-core --target wasm32-wasip1 ${{ matrix.feature_args }}
      - name: Run the arena suite on wasm32
        # The crate that owns the untrusted-image loaders and every page
        # offset. Its tests only started building for this target once the
        # native-only proptest harness was gated off it; before that the layer
        # with the most 32-bit arithmetic was the one never run at 32 bits.
        run: cargo test --release -p plugmem-arena --target wasm32-wasip1 ${{ matrix.feature_args }}

  # Build the pure-no_std probe for wasm32 AND wasm64 (WebAssembly 3.0
  # memory64), execute the artifacts in whichever runtime supports them, and
  # require the printed snapshot hash to equal the native run byte-for-byte.
  # One green run = the file format is pointer-width independent (specs/14 §3).
  wasm-equivalence:
    name: snapshot equivalence (native vs wasm32 vs wasm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # wasm64-unknown-unknown is tier 3: no prebuilt std, so core+alloc are
      # built from source on nightly (build-std needs rust-src).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Install wasmtime and wasmer
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version ${{ env.WASMTIME_VERSION }}
          curl https://get.wasmer.io -sSfL | sh -s ${{ env.WASMER_VERSION }}
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"
      - name: Native reference hash
        run: |
          REF="$(cargo +stable run --release -p plugmem-wasm-probe --bin wasm-probe)"
          echo "reference: $REF"
          echo "REF=$REF" >> "$GITHUB_ENV"
      - name: Build the probe for wasm32 and wasm64
        run: |
          cargo +stable build --release --lib -p plugmem-wasm-probe --target wasm32-unknown-unknown
          cargo +nightly build --release --lib -p plugmem-wasm-probe --target wasm64-unknown-unknown -Zbuild-std=core,alloc
      - name: Execute and compare (wasmtime wasm32 + wasm64, wasmer wasm32)
        run: |
          W32=target/wasm32-unknown-unknown/release/plugmem_wasm_probe.wasm
          W64=target/wasm64-unknown-unknown/release/plugmem_wasm_probe.wasm
          fail=0
          for label in "wasmtime-wasm32" "wasmtime-wasm64" "wasmer-wasm32"; do
            case "$label" in
              wasmtime-wasm32) OUT="$(wasmtime run --invoke run "$W32" 2>/dev/null | tail -n1)" ;;
              wasmtime-wasm64) OUT="$(wasmtime run --invoke run "$W64" 2>/dev/null | tail -n1)" ;;
              wasmer-wasm32)   OUT="$(wasmer run --invoke run "$W32" 2>/dev/null | tail -n1)" ;;
            esac
            echo "$label: $OUT"
            if [ "$OUT" != "$REF" ]; then
              echo "::error::$label produced '$OUT', native produced '$REF' — the snapshot is NOT target-independent"
              fail=1
            fi
          done
          exit $fail
      - name: Probe wasmer on wasm64 (informational — unsupported as of 7.2)
        # Never fails the build: wasmer cannot execute Rust-built memory64
        # modules today (specs/14 §3). The day this step starts succeeding,
        # update specs/14 and consider promoting it into the matrix above.
        run: |
          W64=target/wasm64-unknown-unknown/release/plugmem_wasm_probe.wasm
          if OUT="$(wasmer run --enable-memory64 --invoke run "$W64" 2>&1 | tail -n1)" && [ "$OUT" = "$REF" ]; then
            echo "::notice::wasmer now runs memory64 and matches ($OUT) — update specs/14 §3 and add it to the required matrix"
          else
            echo "wasmer still cannot run the wasm64 artifact (expected): $OUT"
          fi

  # Structural skill gate, first thing on every PR: skill/SKILL.md must exist,
  # carry a well-formed `<!-- skill-version -->` marker and fit the Agent
  # Skills frontmatter limits. Version EQUALITY with the workspace is enforced
  # at release time against the version being cut (release.yml `skill-check`).
  skill-lint:
    name: skill structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: SKILL.md exists and carries a well-formed version marker
        run: |
          test -f skill/SKILL.md || { echo "::error::skill/SKILL.md is missing"; exit 1; }
          MARKER="$(grep -oE 'skill-version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+' skill/SKILL.md | head -n1)"
          if [ -z "$MARKER" ]; then
            echo "::error file=skill/SKILL.md::missing '<!-- skill-version: X.Y.Z -->' marker"
            exit 1
          fi
          for m in 'wasm-strip:begin' 'wasm-strip:end'; do
            grep -q "$m" skill/SKILL.md || { echo "::error file=skill/SKILL.md::missing '<!-- $m -->' marker"; exit 1; }
          done
          echo "OK: $MARKER, wasm-strip fence present"
      - name: Frontmatter fits Agent Skills limits (name <= 64, description <= 1024)
        run: |
          ruby -ryaml <<'RUBY'
          content = File.read("skill/SKILL.md")
          fm = content.split(/^---\s*$/, 3)[1] or abort "::error file=skill/SKILL.md::missing YAML frontmatter"
          d = YAML.safe_load(fm)
          name = d["name"].to_s
          desc = d["description"].to_s
          errs = []
          errs << "name is #{name.length} chars (max 64)" if name.length > 64
          errs << "description is #{desc.length} chars (max 1024)" if desc.length > 1024
          if errs.any?
            errs.each { |e| warn "::error file=skill/SKILL.md::#{e}" }
            exit 1
          end
          puts "OK: name #{name.length}/64, description #{desc.length}/1024"
          RUBY

  # Build the native Node addon for the host platform and smoke-test it through
  # Node, so the published addon can never silently rot. The full cross-platform
  # build + publish lives in release.yml (`napi-build` / `publish-napi`).
  napi-npm:
    name: napi npm build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/plugmem-napi
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/plugmem-napi"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies (@napi-rs/cli)
        run: npm ci
      - name: Build the addon
        # `@napi-rs/cli` is a *local* devDependency (installed by `npm ci` into
        # node_modules/.bin), not global — invoke it through `npx` so the bare
        # `napi` binary resolves. A plain `napi build` fails with "command not
        # found" because node_modules/.bin is not on PATH outside an npm script.
        run: npx napi build --platform --release
      - name: The committed bindings match the Rust surface
        # `index.js` and `index.d.ts` are generated by the build above AND
        # committed (see the crate's .gitignore for why: they are the meta npm
        # package's only payload). Committed generated files can go stale, so
        # this is the gate that says they cannot: change a `#[napi]` signature
        # without regenerating and the PR goes red here instead of shipping a
        # loader or a type surface that does not match the addon.
        run: |
          if ! git diff --exit-code -- index.js index.d.ts; then
            echo "::error::index.js/index.d.ts are stale — run" \
                 "\`npx napi build --platform\` in crates/plugmem-napi and commit the result"
            exit 1
          fi
      - name: Test through Node
        run: npm test
      - name: Type-check the generated .d.ts
        # `index.d.ts` is generated by the build above, so this runs after it.
        # It compiles the declarations plus a consumer-shaped type test under
        # `strict` + `isolatedModules`, which is what catches a surface that is
        # valid Rust and unusable TypeScript.
        run: npm run typecheck

  py-wheel:
    name: python wheel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/plugmem-py
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/plugmem-py"
      - uses: actions/setup-python@v6
        with:
          # The floor `abi3-py310` targets. Building on it proves the wheel we
          # ship is the wheel we test, rather than one that happens to work on
          # whatever the runner defaults to.
          python-version: "3.10"
      - name: Install the build and check tools
        run: pip install "maturin>=1.14,<2.0" pytest mypy
      - name: Build and install the extension
        run: maturin develop
      - name: The committed stubs match the Rust surface
        # `python/plugmem/_plugmem.pyi` is generated AND committed, because it
        # is what gives an editor completion and a type checker something to
        # check. Committed generated files go stale, and a stale stub is worse
        # than none: it confidently completes a method that no longer exists.
        # Same gate, same reasoning, as `index.d.ts` in the Node binding above.
        run: |
          cargo run --quiet --bin stub_gen
          if ! git diff --exit-code -- python/plugmem/_plugmem.pyi; then
            echo "::error::the stubs are stale — run" \
                 "\`cargo run --bin stub_gen\` in crates/plugmem-py and commit the result"
            exit 1
          fi
      - name: The stubs type-check
        # This is the gate that makes `stub_gen`'s two post-generation fixups
        # safe to rely on. One of them patches a defect in pyo3-stub-gen 0.23
        # (it qualifies our own exception base as `builtins.PlugmemError`); if
        # upstream changes shape, that patch silently stops applying and the
        # whole exception hierarchy quietly degrades to `Any`. Checking the
        # stub itself turns that silence into a red build.
        run: mypy --strict python/plugmem/_plugmem.pyi python/plugmem/__init__.py
      - name: Test through Python
        run: pytest -q

  dist-plan:
    name: cargo-dist plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh"
      - name: Validate the release plan
        run: dist plan

  # --- single branch-protection gate -----------------------------------------
  # Make ONLY this check "required" on the protected branch. It aggregates every
  # real job above, so branch protection never needs editing when jobs are
  # added/removed, and it reports for every PR (no paths filter) — including the
  # release sync PR, which reuses this same workflow. `if: always()` lets it run
  # even when a dependency failed, so it can turn that into a red required check.
  ci-pass:
    name: CI passed
    if: always()
    needs: [format, check, fuzz, no_std, wasm-suite, wasm-equivalence, skill-lint, napi-npm, py-wheel, dist-plan]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required CI job failed or was cancelled:"
          echo "  format           = ${{ needs.format.result }}"
          echo "  check            = ${{ needs.check.result }}"
          echo "  fuzz             = ${{ needs.fuzz.result }}"
          echo "  no_std           = ${{ needs.no_std.result }}"
          echo "  wasm-suite       = ${{ needs.wasm-suite.result }}"
          echo "  wasm-equivalence = ${{ needs.wasm-equivalence.result }}"
          echo "  skill-lint       = ${{ needs.skill-lint.result }}"
          echo "  napi-npm         = ${{ needs.napi-npm.result }}"
          echo "  dist-plan        = ${{ needs.dist-plan.result }}"
          exit 1
      - name: All required jobs passed
        run: echo "format + lint/test (3 OSes × feature matrix), no_std, wasm suite (wasmtime+wasmer), cross-target equivalence, skill, napi npm and dist-plan are green."
