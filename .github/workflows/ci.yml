name: CI

on:
  # Push CI runs only on the default branch (post-merge validation). Feature
  # branches are covered by the pull_request event below, so a branch with an
  # open PR is not built twice (one push run + one PR run racing each other).
  # rc/v* release branches run through workflow_call, not this trigger.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "crates/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
  # No paths filter on PRs on purpose: the branch-protection gate (`ci-pass`
  # below) is a *required* check, so it must ALWAYS report. With a paths filter
  # a docs-only PR would never start the workflow and the required check would
  # hang forever ("Expected — waiting for status"). CI is cached and cheap, so
  # we just let it run on every PR.
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: false
        type: string
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

# Runtime versions for the wasm execution jobs. Pinned to the versions the
# cross-target equivalence was validated against (specs/14 §3); bump by hand
# together with a fresh local validation run.
env:
  WASMTIME_VERSION: "v41.0.3"
  WASMER_VERSION: "v7.2.0"

jobs:
  # --- linter + tests, fanned out across all three OSes in parallel ----------
  # One matrix entry per OS, no cross-job `needs`, so Linux/Windows/macOS each
  # run fmt + clippy + test independently and any single failure is visible at
  # a glance (fail-fast off keeps the others going).
  #
  # Features change which code compiles (specs/07 §8: clippy on one combo does
  # not cover the others). Two feature axes alter the code surface: `counters`
  # (the deterministic perf gates) and `serde` (Serialize/Deserialize derives),
  # so clippy and tests run with each off and on. (There is no `std` feature:
  # the core and arena are `no_std` unconditionally; the real no_std gate is the
  # wasm32v1-none build job below.)

  check:
    name: lint + test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The bench-charts dev tool (plotters → font-kit) needs system
      # fontconfig at build time on Linux; the shipped crates do not.
      # macOS/Windows resolve system fonts without it.
      - name: System deps for the chart tool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (counters — a different code surface)
        run: cargo clippy --workspace --all-targets --features counters -- -D warnings
      - name: Clippy (serde — a different code surface)
        run: cargo clippy --workspace --all-targets --features serde -- -D warnings
      - name: Tests (default)
        run: cargo test --workspace
      - name: Tests (counters — includes the deterministic perf gates)
        run: cargo test --workspace --features counters
      - name: Tests (serde — the JSON round-trip suite)
        run: cargo test --workspace --features serde

  # --- portability checks, in parallel with the lint+test matrix above -------

  no_std:
    name: no_std build (wasm32v1-none)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build libraries for a real no_std target
        run: >-
          cargo build -p plugmem-arena -p plugmem-core
          --target wasm32v1-none
      - name: Build again with counters (a different code surface)
        run: >-
          cargo build -p plugmem-arena -p plugmem-core
          --features counters --target wasm32v1-none
      - name: Build again with serde (proves serde works under no_std)
        run: >-
          cargo build -p plugmem-arena -p plugmem-core
          --features serde --target wasm32v1-none

  # The whole contract test suite of the core, executed on a REAL 32-bit
  # target under both independent wasm runtimes, in both feature
  # configurations. This is what caught the 32-bit journal allocation abort
  # (specs/14 §5) that native 64-bit CI can never see. proptest sections are
  # native-only (gated in the test files); everything else runs.
  wasm-suite:
    name: core suite on wasm32 (${{ matrix.runtime }}${{ matrix.features && ', counters' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [wasmtime, wasmer]
        features: ["", "--features counters"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Install wasmtime
        if: matrix.runtime == 'wasmtime'
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version ${{ env.WASMTIME_VERSION }}
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_WASM32_WASIP1_RUNNER=wasmtime run --dir=." >> "$GITHUB_ENV"
      - name: Install wasmer
        if: matrix.runtime == 'wasmer'
        run: |
          curl https://get.wasmer.io -sSfL | sh -s ${{ env.WASMER_VERSION }}
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_WASM32_WASIP1_RUNNER=wasmer run" >> "$GITHUB_ENV"
      - name: Run the core suite on wasm32
        # Release: the torn-tail/bitflip matrices are byte-loops that crawl in
        # a debug interpreter-free JIT but still add minutes; release keeps the
        # whole suite in seconds.
        run: cargo test --release -p plugmem-core --target wasm32-wasip1 ${{ matrix.features }}

  # Build the pure-no_std probe for wasm32 AND wasm64 (WebAssembly 3.0
  # memory64), execute the artifacts in whichever runtime supports them, and
  # require the printed snapshot hash to equal the native run byte-for-byte.
  # One green run = the file format is pointer-width independent (specs/14 §3).
  wasm-equivalence:
    name: snapshot equivalence (native vs wasm32 vs wasm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # wasm64-unknown-unknown is tier 3: no prebuilt std, so core+alloc are
      # built from source on nightly (build-std needs rust-src).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Install wasmtime and wasmer
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version ${{ env.WASMTIME_VERSION }}
          curl https://get.wasmer.io -sSfL | sh -s ${{ env.WASMER_VERSION }}
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"
      - name: Native reference hash
        run: |
          REF="$(cargo +stable run --release -p plugmem-wasm-probe --bin wasm-probe)"
          echo "reference: $REF"
          echo "REF=$REF" >> "$GITHUB_ENV"
      - name: Build the probe for wasm32 and wasm64
        run: |
          cargo +stable build --release --lib -p plugmem-wasm-probe --target wasm32-unknown-unknown
          cargo +nightly build --release --lib -p plugmem-wasm-probe --target wasm64-unknown-unknown -Zbuild-std=core,alloc
      - name: Execute and compare (wasmtime wasm32 + wasm64, wasmer wasm32)
        run: |
          W32=target/wasm32-unknown-unknown/release/plugmem_wasm_probe.wasm
          W64=target/wasm64-unknown-unknown/release/plugmem_wasm_probe.wasm
          fail=0
          for label in "wasmtime-wasm32" "wasmtime-wasm64" "wasmer-wasm32"; do
            case "$label" in
              wasmtime-wasm32) OUT="$(wasmtime run --invoke run "$W32" 2>/dev/null | tail -n1)" ;;
              wasmtime-wasm64) OUT="$(wasmtime run --invoke run "$W64" 2>/dev/null | tail -n1)" ;;
              wasmer-wasm32)   OUT="$(wasmer run --invoke run "$W32" 2>/dev/null | tail -n1)" ;;
            esac
            echo "$label: $OUT"
            if [ "$OUT" != "$REF" ]; then
              echo "::error::$label produced '$OUT', native produced '$REF' — the snapshot is NOT target-independent"
              fail=1
            fi
          done
          exit $fail
      - name: Probe wasmer on wasm64 (informational — unsupported as of 7.2)
        # Never fails the build: wasmer cannot execute Rust-built memory64
        # modules today (specs/14 §3). The day this step starts succeeding,
        # update specs/14 and consider promoting it into the matrix above.
        run: |
          W64=target/wasm64-unknown-unknown/release/plugmem_wasm_probe.wasm
          if OUT="$(wasmer run --enable-memory64 --invoke run "$W64" 2>&1 | tail -n1)" && [ "$OUT" = "$REF" ]; then
            echo "::notice::wasmer now runs memory64 and matches ($OUT) — update specs/14 §3 and add it to the required matrix"
          else
            echo "wasmer still cannot run the wasm64 artifact (expected): $OUT"
          fi

  # Structural skill gate, first thing on every PR: skill/SKILL.md must exist,
  # carry a well-formed `<!-- skill-version -->` marker and fit the Agent
  # Skills frontmatter limits. Version EQUALITY with the workspace is enforced
  # at release time against the version being cut (release.yml `skill-check`).
  skill-lint:
    name: skill structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: SKILL.md exists and carries a well-formed version marker
        run: |
          test -f skill/SKILL.md || { echo "::error::skill/SKILL.md is missing"; exit 1; }
          MARKER="$(grep -oE 'skill-version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+' skill/SKILL.md | head -n1)"
          if [ -z "$MARKER" ]; then
            echo "::error file=skill/SKILL.md::missing '<!-- skill-version: X.Y.Z -->' marker"
            exit 1
          fi
          for m in 'wasm-strip:begin' 'wasm-strip:end'; do
            grep -q "$m" skill/SKILL.md || { echo "::error file=skill/SKILL.md::missing '<!-- $m -->' marker"; exit 1; }
          done
          echo "OK: $MARKER, wasm-strip fence present"
      - name: Frontmatter fits Agent Skills limits (name <= 64, description <= 1024)
        run: |
          ruby -ryaml <<'RUBY'
          content = File.read("skill/SKILL.md")
          fm = content.split(/^---\s*$/, 3)[1] or abort "::error file=skill/SKILL.md::missing YAML frontmatter"
          d = YAML.safe_load(fm)
          name = d["name"].to_s
          desc = d["description"].to_s
          errs = []
          errs << "name is #{name.length} chars (max 64)" if name.length > 64
          errs << "description is #{desc.length} chars (max 1024)" if desc.length > 1024
          if errs.any?
            errs.each { |e| warn "::error file=skill/SKILL.md::#{e}" }
            exit 1
          end
          puts "OK: name #{name.length}/64, description #{desc.length}/1024"
          RUBY

  # Build the native Node addon for the host platform and smoke-test it through
  # Node, so the published addon can never silently rot. The full cross-platform
  # build + publish lives in release.yml (`napi-build` / `publish-napi`).
  napi-npm:
    name: napi npm build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/plugmem-napi
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/plugmem-napi"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies (@napi-rs/cli)
        run: npm ci
      - name: Build the addon
        # `@napi-rs/cli` is a *local* devDependency (installed by `npm ci` into
        # node_modules/.bin), not global — invoke it through `npx` so the bare
        # `napi` binary resolves. A plain `napi build` fails with "command not
        # found" because node_modules/.bin is not on PATH outside an npm script.
        run: npx napi build --platform --release
      - name: Test through Node
        run: npm test

  dist-plan:
    name: cargo-dist plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh"
      - name: Validate the release plan
        run: dist plan

  # --- single branch-protection gate -----------------------------------------
  # Make ONLY this check "required" on the protected branch. It aggregates every
  # real job above, so branch protection never needs editing when jobs are
  # added/removed, and it reports for every PR (no paths filter) — including the
  # release sync PR, which reuses this same workflow. `if: always()` lets it run
  # even when a dependency failed, so it can turn that into a red required check.
  ci-pass:
    name: CI passed
    if: always()
    needs: [check, no_std, wasm-suite, wasm-equivalence, skill-lint, napi-npm, dist-plan]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required CI job failed or was cancelled:"
          echo "  check            = ${{ needs.check.result }}"
          echo "  no_std           = ${{ needs.no_std.result }}"
          echo "  wasm-suite       = ${{ needs.wasm-suite.result }}"
          echo "  wasm-equivalence = ${{ needs.wasm-equivalence.result }}"
          echo "  skill-lint       = ${{ needs.skill-lint.result }}"
          echo "  napi-npm         = ${{ needs.napi-npm.result }}"
          echo "  dist-plan        = ${{ needs.dist-plan.result }}"
          exit 1
      - name: All required jobs passed
        run: echo "lint + test (3 OSes × feature matrix), no_std, wasm suite (wasmtime+wasmer), cross-target equivalence, skill, napi npm and dist-plan are green."
