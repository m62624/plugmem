name: coverage

# Line coverage for the library crates, uploaded to Codecov. Kept as its own
# workflow. The local tarpaulin result is a hard >= 90% gate; the separate
# Codecov upload remains informational so an upload-side outage cannot fail a
# sound measurement. Scope and exclusions live in tarpaulin.toml, the single
# source of truth shared with local `cargo tarpaulin` runs.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/coverage.yml"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tarpaulin.toml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: coverage (tarpaulin → Codecov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # tarpaulin builds the whole workspace (the metric is narrowed in
      # tarpaulin.toml, but every member still compiles), and the
      # bench-charts dev tool needs system fontconfig on Linux.
      - name: System deps for the chart tool
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      # Prebuilt binary — far faster than `cargo install cargo-tarpaulin`.
      - uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-tarpaulin
      # Reads tarpaulin.toml for workspace + exclude-files; we only override the
      # output to a Cobertura XML at the repo root for the Codecov upload step.
      - name: Generate coverage (Cobertura XML)
        run: cargo tarpaulin --timeout 300 --verbose --fail-under 90 --out Xml --output-dir .
      - name: Upload to Codecov
        if: hashFiles('cobertura.xml') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          # Never red the workflow on a Codecov-side upload error.
          fail_ci_if_error: false
