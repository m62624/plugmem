name: TEMP Release build probe

# TEMPORARY: remove this whole workflow after one green run on the PR. It
# mirrors every artifact-building job in release.yml, but never creates a tag,
# release, or registry publication.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # Mirrors the local cargo-dist jobs generated by bin-release.yml. The release
  # workflow later uploads these artifacts to a draft; this probe only builds
  # them and uploads them as ordinary Actions artifacts.
  dist-build:
    name: TEMP dist build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - { target: aarch64-pc-windows-msvc, runner: windows-2022 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: x86_64-pc-windows-msvc, runner: windows-2022 }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          submodules: recursive
      - name: Install dist (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh
      - name: Install dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: irm https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.ps1 | iex
      - name: Install WiX v3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          $dest = "$env:RUNNER_TEMP\wix3"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\wix3.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\wix3.zip" -DestinationPath $dest -Force
          if (-not (Test-Path "$dest\candle.exe")) { throw "candle.exe missing after WiX install" }
          Add-Content -Path $env:GITHUB_PATH -Value $dest
      - name: Build release artifacts without publishing
        shell: bash
        run: dist build --artifacts=local --target=${{ matrix.target }} --output-format=json > dist-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: temp-dist-${{ matrix.target }}
          path: |
            target/distrib/**
            dist-manifest.json
          if-no-files-found: error

  # Mirrors release.yml's napi-build matrix. No npm package is assembled or
  # published here; each native addon is only compiled and uploaded.
  napi-build:
    name: TEMP napi build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, host: ubuntu-24.04, zig: false }
          - { target: aarch64-unknown-linux-gnu, host: ubuntu-24.04, zig: true }
          - { target: x86_64-apple-darwin, host: macos-26-intel, zig: false }
          - { target: aarch64-apple-darwin, host: macos-26, zig: false }
          - { target: x86_64-pc-windows-msvc, host: windows-2025, zig: false }
          - { target: aarch64-pc-windows-msvc, host: windows-2025, zig: false }
    runs-on: ${{ matrix.host }}
    defaults:
      run:
        working-directory: crates/plugmem-napi
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/plugmem-napi"
      - name: Install dependencies (@napi-rs/cli)
        run: npm ci
      - name: Install Zig
        if: matrix.zig
        uses: mlugg/setup-zig@v2
      - name: Build the addon without publishing
        run: npx napi build --platform --release --target ${{ matrix.target }} ${{ matrix.zig && '--zig' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: temp-napi-${{ matrix.target }}
          path: crates/plugmem-napi/*.node
          if-no-files-found: error

  # Mirrors release.yml's py-build matrix, including both abi3 and free-
  # threaded wheels. In particular, this proves the new native Windows ARM64
  # runner and interpreter before the release workflow is allowed to use it.
  py-build:
    name: TEMP Python wheels (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, host: ubuntu-24.04, manylinux: auto, freethreaded: true, python_arch: x64 }
          - { target: aarch64-unknown-linux-gnu, host: ubuntu-24.04-arm, manylinux: auto, freethreaded: true, python_arch: arm64 }
          - { target: x86_64-apple-darwin, host: macos-26-intel, manylinux: "off", freethreaded: true, python_arch: x64 }
          - { target: aarch64-apple-darwin, host: macos-26, manylinux: "off", freethreaded: true, python_arch: arm64 }
          - { target: x86_64-pc-windows-msvc, host: windows-2025, manylinux: "off", freethreaded: true, python_arch: x64 }
          - { target: aarch64-pc-windows-msvc, host: windows-11-arm, manylinux: "off", freethreaded: true, python_arch: arm64 }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: The wheel carries the licence
        shell: bash
        run: cp LICENSE crates/plugmem-py/LICENSE
      - name: Build the abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: crates/plugmem-py
          args: --release --out dist
          sccache: "true"
      - name: Set up the free-threaded interpreter
        if: matrix.freethreaded && matrix.manylinux == 'off'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"
          architecture: ${{ matrix.python_arch }}
      - name: Build the free-threaded wheel
        if: matrix.freethreaded
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: crates/plugmem-py
          args: --release --out dist -i python3.14t
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: temp-py-${{ matrix.target }}
          path: crates/plugmem-py/dist/*.whl
          if-no-files-found: error

  # Mirrors release.yml's platform-independent source distribution build.
  py-sdist:
    name: TEMP Python sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - shell: bash
        run: cp LICENSE crates/plugmem-py/LICENSE
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: crates/plugmem-py
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: temp-py-sdist
          path: crates/plugmem-py/dist/*.tar.gz
          if-no-files-found: error
