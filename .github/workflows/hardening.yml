name: hardening

# Heavy memory-safety audits (MIRI + valgrind). These are slow (minutes each),
# so they do NOT run on every push. Instead:
#   - workflow_dispatch : run on demand.
#   - schedule (weekly) : a heartbeat so the audit can never silently rot even
#                         if no PR is ever labelled.
#   - pull_request      : opt-in per PR via the `ci-hardening` label (the jobs
#                         self-skip when the label is absent — see each `if`).
#   - workflow_call     : the release orchestrator (release.yml) invokes this on
#                         the RC branch, making a clean audit a hard release gate.
#
# The fast per-PR leak-growth *regression* signal lives elsewhere: the
# deterministic `readers_and_checkpoints_do_not_leak_across_rounds` test (bounded
# generations + fds, no valgrind) runs in the normal `cargo test` matrix on every
# PR. This workflow is the deep, authoritative pass.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: false
        type: string
  schedule:
    # Mondays 04:17 UTC. Off the hour to avoid the scheduler's top-of-hour rush.
    - cron: "17 4 * * 1"
  pull_request:
    types: [labeled, synchronize, reopened]

concurrency:
  group: hardening-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # MIRI — Rust-level UB and aliasing violations (Stacked Borrows) plus
  # uninitialised reads on the arena, the one crate that carries `unsafe`.
  # MIRI is a deterministic interpreter and cannot touch mmap, so it never runs
  # on the host.
  #   - arena carries the workspace's only real `unsafe` (an uninitialised-page
  #     `set_len` on the flat byte arenas): this is where MIRI earns its keep,
  #     and it is fast (~30 s).
  #   - core is NOT audited here: it declares `#![forbid(unsafe_code)]`, so
  #     "the core is UB-free" is a compile-time guarantee. Running its (safe)
  #     suite under MIRI's ~100x interpreter added no coverage while costing
  #     ~45 min on the maintain rebuilds — a compile-time forbid is both cheaper
  #     and stronger (it checks all code, not just the paths a test happens to
  #     hit). If core ever genuinely needs `unsafe`, downgrade that one site to a
  #     documented `#[allow]` and add a targeted MIRI step back.
  miri:
    name: miri (arena — the crate's sole unsafe)
    # On a pull_request, run only when the PR carries the `ci-hardening` label.
    # On dispatch / schedule / workflow_call (release) the event is not
    # pull_request, so the audit always runs.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci-hardening')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: miri — arena (the crate's unsafe, strict aliasing)
        run: cargo +nightly miri test -p plugmem-arena

  # valgrind (memcheck) — real-execution memory errors and leaks on the host
  # mmap/generation machinery, which MIRI cannot reach. This is the
  # authoritative answer to "does the mmap footprint leak, or is it constant?":
  # memcheck fails on invalid access / use-after-free and on definitely/
  # indirectly-lost blocks, while a still-mapped generation held by a live reader
  # is `still reachable` (not a leak) and does not fail the build.
  #   - libc6-dbg ships the non-stripped ld.so valgrind mandates at startup.
  #   - RUSTFLAGS=--cfg valgrind skips the wall-clock watchdog stress tests
  #     (concurrency.rs): under valgrind's ~100x slowdown their deadlines would
  #     false-trip as deadlocks. The mmap/generation correctness + the
  #     deterministic leak-growth test still run.
  #   - PLUGMEM_LEAK_ROUNDS keeps the leak-growth churn bounded so the run stays
  #     minutes, not tens of minutes, under the interpreter.
  #   - the run is a CURATED subset of tests/host.rs, not the whole file (see
  #     the step below for the selection rule and the drift guard).
  valgrind:
    name: valgrind (host mmap + leak-growth)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci-hardening')
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--cfg valgrind"
      PLUGMEM_LEAK_ROUNDS: "40"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System deps (valgrind + non-stripped ld.so)
        run: sudo apt-get update && sudo apt-get install -y valgrind libc6-dbg
      - name: cargo-valgrind
        run: cargo install cargo-valgrind --locked
      - name: memcheck — host mmap/generation + leak-growth tests
        run: |
          set -euo pipefail
          # memcheck only has something to say about tests that map a snapshot,
          # rotate or reclaim a generation, or churn readers and fds — that is
          # the machinery MIRI structurally cannot reach. The rest of host.rs is
          # engine semantics (embedder mock servers, export paging, metadata
          # ordering, error typing): running those under a ~100x interpreter
          # buys no memory-safety signal and would cost most of the job. So the
          # audit runs this curated list, not the whole file.
          tests=(
            # generation lifecycle: map, rotate, reclaim, pin.
            checkpoint_advances_the_generation_and_reclaims_the_old
            gc_reclaims_unpinned_generations_and_a_pin_keeps_one
            refresh_advances_a_reader_to_a_new_generation
            scrub_pins_its_generation_and_coexists_with_the_writer
            maintain_compacts_disk_first_and_the_engine_stays_live
            # the leak verdict itself: bounded rounds of readers + checkpoints.
            readers_and_checkpoints_do_not_leak_across_rounds
            # concurrent mappings of one image, and reader/writer coexistence.
            many_readers_share_one_snapshot
            a_reader_opens_alongside_a_live_writer
            open_readonly_matches_read_write
            open_readonly_refuses_a_dirty_journal
            open_readonly_does_not_block_the_writer
            # the borrowed-pool overlay: the mapping outlives the open call.
            overlay_writes_survive_repeated_snapshots_and_reopen
            a_re_mapped_snapshot_is_canonical_against_an_owned_replay
            an_overlay_open_residents_far_less_than_the_image
          )
          cargo valgrind test -p plugmem-host --test host \
            -- --exact "${tests[@]}" 2>&1 | tee memcheck.log
          # A libtest filter that matches nothing is silently skipped, so a
          # renamed test would quietly drop out of the audit and the job would
          # still be green. Compare what ran against what was asked for.
          ran="$(sed -n 's/^test result: ok\. \([0-9]\+\) passed.*/\1/p' memcheck.log)"
          if [ "${ran:-0}" -ne "${#tests[@]}" ]; then
            echo "::error::memcheck ran ${ran:-0} of ${#tests[@]} curated tests —" \
                 "a test was renamed or removed; update the list in this workflow"
            exit 1
          fi
          echo "memcheck covered all ${#tests[@]} curated mmap/leak tests"

  # Aggregate gate: a single job the release orchestrator (and any branch
  # protection) can require. Fails if either audit failed or was cancelled;
  # a legitimately-skipped audit (unlabelled PR) is not a failure.
  hardening-pass:
    name: hardening passed
    if: always()
    needs: [miri, valgrind]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if an audit failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A hardening audit failed or was cancelled:"
          echo "  miri     = ${{ needs.miri.result }}"
          echo "  valgrind = ${{ needs.valgrind.result }}"
          exit 1
      - name: Audits passed (or were skipped on an unlabelled PR)
        run: echo "miri (arena+core) and valgrind (host) are green or skipped."
