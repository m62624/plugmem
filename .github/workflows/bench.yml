# Benchmarks on demand — informational only, NEVER a merge gate.
#
# Shared CI runners have noisy, heterogeneous hardware, so wall-clock numbers
# from here are a sanity trend at best. The merge-blocking performance evidence
# is the deterministic work-counter gates in
# crates/plugmem-core/tests/perf_gates.rs (and the arena's), which run in
# regular CI under `--features counters` and are bit-identical on any machine.
#
# One trigger, one label: a human adds the `benchmark` label to a PR (re-add
# it to re-run), or dispatches this workflow by hand. Both jobs run off that
# single label so there is no second, divergent benchmark pipeline:
#   - `criterion` — the full statistical suite into the job log.
#   - `charts`    — regenerates the README chart SVGs on the runner and reports
#                   what moved versus the committed charts (artifact + summary
#                   + a sticky PR comment). It never commits anything.
# Nothing runs automatically and no release build carries any of this.
name: bench

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WASMTIME_VERSION: "v41.0.3"
  WASMER_VERSION: "v7.2.0"

jobs:
  criterion:
    name: criterion (informational)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'benchmark'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run benchmarks
        # Plain text into the job log; no artifacts, no thresholds, no gating.
        run: |
          cargo bench -p plugmem-arena
          cargo bench -p plugmem-core

  charts:
    name: regenerate benchmark charts
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'benchmark'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2

      # bench-charts (plotters → font-kit) needs system fontconfig on Linux.
      - name: System deps for the chart tool
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version "$WASMTIME_VERSION"
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: Install wasmer
        run: |
          curl https://get.wasmer.io -sSfL | sh -s "$WASMER_VERSION"
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"

      - name: Measure and render
        run: |
          set -euo pipefail
          # Arena: run the cross-runtime stand a few times (rows are averaged).
          for i in 1 2 3; do
            cargo run -qr -p plugmem-bench-matrix
          done | grep -P '^\d+\t' > bench.tsv
          # Core: the engine's recall-source latencies.
          cargo run -qr -p plugmem-core --example bench_ops >> bench.tsv
          # Render (force: a fresh machine always differs from the committed
          # baseline, and we want the runner's charts regardless).
          cargo run -qr -p plugmem-bench-charts -- bench.tsv --force | tee charts-report.txt

      - name: Summarize
        run: |
          {
            echo '## Benchmark charts (this runner)'
            echo
            echo 'Regenerated from a fresh measurement on the CI runner. Download'
            echo 'the `benchmark-charts` artifact to view the SVGs; the committed'
            echo 'charts are on a different machine, so absolute numbers differ.'
            echo
            echo '### Per-chart delta vs the committed baseline'
            echo '```'
            cat charts-report.txt
            echo '```'
            echo '### Files changed'
            echo '```'
            git status --short crates/plugmem-arena/assets crates/plugmem-core/assets || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload regenerated charts
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-charts
          path: |
            crates/plugmem-arena/assets/arena-*.svg
            crates/plugmem-core/assets/recall-latency.svg
          if-no-files-found: error

      - name: Comment the delta on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('charts-report.txt', 'utf8');
            const marker = '<!-- bench-charts -->';
            const body = [
              marker,
              '## 📊 Benchmark charts regenerated',
              '',
              'Measured on this CI runner (a different machine than the committed',
              'charts, so absolute numbers differ). The regenerated SVGs are in the',
              '`benchmark-charts` artifact of this run.',
              '',
              '<details><summary>Per-chart delta vs the committed baseline</summary>',
              '',
              '```',
              report.trim(),
              '```',
              '</details>',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const mine = comments.data.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
