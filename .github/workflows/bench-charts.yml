name: bench charts

# Regenerates the benchmark chart SVGs on a runner and reports what moved.
# Label-gated so it does not run on every PR: add the `performance` label
# (the title labeler adds it for `perf:` PRs) or dispatch it by hand. The
# runner is a different machine than whoever committed the charts, so the
# numbers will differ — the point is to show a reviewer the freshly
# measured charts and their delta versus what is committed, as a downloadable
# artifact plus a summary. It never commits anything.

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

env:
  WASMTIME_VERSION: "v41.0.3"
  WASMER_VERSION: "v7.2.0"

jobs:
  render:
    name: render benchmark charts
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'performance')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2

      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version "$WASMTIME_VERSION"
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: Install wasmer
        run: |
          curl https://get.wasmer.io -sSfL | sh -s "$WASMER_VERSION"
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"

      - name: Measure and render
        run: |
          set -euo pipefail
          # Arena: run the cross-runtime stand a few times (rows are averaged).
          for i in 1 2 3; do
            cargo run -qr -p plugmem-bench-matrix
          done | grep -P '^\d+\t' > bench.tsv
          # Core: the engine's recall-source latencies.
          cargo run -qr -p plugmem-core --example bench_ops >> bench.tsv
          # Render (force: a fresh machine always differs from the committed
          # baseline, and we want the runner's charts regardless).
          cargo run -qr -p plugmem-bench-charts -- bench.tsv --force | tee charts-report.txt

      - name: Summarize
        run: |
          {
            echo '## Benchmark charts (this runner)'
            echo
            echo 'Regenerated from a fresh measurement on the CI runner. Download'
            echo 'the `benchmark-charts` artifact to view the SVGs; the committed'
            echo 'charts are on a different machine, so absolute numbers differ.'
            echo
            echo '### Per-chart delta vs the committed baseline'
            echo '```'
            cat charts-report.txt
            echo '```'
            echo '### Files changed'
            echo '```'
            git status --short crates/plugmem-arena/assets crates/plugmem-core/assets || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload regenerated charts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-charts
          path: |
            crates/plugmem-arena/assets/arena-*.svg
            crates/plugmem-core/assets/recall-latency.svg
          if-no-files-found: error

      - name: Comment the delta on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('charts-report.txt', 'utf8');
            const marker = '<!-- bench-charts -->';
            const body = [
              marker,
              '## 📊 Benchmark charts regenerated',
              '',
              'Measured on this CI runner (a different machine than the committed',
              'charts, so absolute numbers differ). The regenerated SVGs are in the',
              '`benchmark-charts` artifact of this run.',
              '',
              '<details><summary>Per-chart delta vs the committed baseline</summary>',
              '',
              '```',
              report.trim(),
              '```',
              '</details>',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const mine = comments.data.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
