# cargo-tarpaulin coverage config — read automatically by `cargo tarpaulin`.
#
# Scope = the library crates (plugmem-arena / -core / -host / -testgen), where
# line coverage reflects what the unit + property tests actually reach. The
# whole workspace is still *built and tested* (binaries' integration tests run
# and must pass); only the coverage *metric* is narrowed via `exclude-files`:
#
#   * crates/plugmem-cli/src/main.rs, crates/plugmem-mcp/* — the binaries are
#     exercised by integration tests that spawn the built executable as a
#     separate process; tarpaulin's ptrace engine cannot attribute a
#     subprocess's executed lines back to source, so their src/ would always
#     read ~0% despite being covered. Excluding them keeps the number honest.
#   * crates/plugmem-py/* — the same argument as plugmem-napi one line down:
#     the `#[pyclass]`/`#[pyfunction]` surface only runs inside a CPython
#     process (exercised by pytest against a built wheel), which tarpaulin
#     cannot attribute; the pure wrapper logic is covered by this crate's own
#     cargo tests through its rlib.
#   * crates/plugmem-napi/* — the `#[napi]` surface only runs when loaded as a
#     `.node` addon inside a Node process (exercised by the JS smoke/verb tests
#     in __test__/), which tarpaulin cannot attribute; the pure wrapper logic
#     (e.g. the skill-version gate) is still covered by this crate's cargo tests.
#   * crates/*/tests/* — we measure the code under test, not the tests.
#
# Coverage mandate (specs/08): target 100% of executable lines for
# plugmem-arena and plugmem-core, with a hard acceptance floor of 90% both for
# core and for the aggregate measured Rust workspace. Node/Python boundaries are
# tested in their real runtimes rather than assigned a tarpaulin percentage. CI
# passes `--fail-under 90`; use the same flag locally. Reports land in coverage/
# (gitignored).
#
# Known analyzer noise: tarpaulin marks some non-executable lines as
# "uncovered" — struct-literal field lines, macro invocation lines
# (`bump!(...)`), attributes, and const-folded `const fn` bodies. Every such
# line in a report must be audited by hand (does a test exercise the
# surrounding statement?) before being dismissed as an artifact; the audit
# happens in review, not by silently lowering the number.
[default]
workspace = true
# Per-test-binary timeout. The default of 60 s is not enough under ptrace
# instrumentation: the host suite's resharding test alone runs ~100 s there
# against well under a second normally, and tarpaulin gives up on the whole run
# rather than on the one test. CI already passed `--timeout 300`, so a local run
# was the only place this bit — exactly the drift this file exists to prevent.
#
# It must be a duration *string*: a bare integer is a parse error, and a parse
# error anywhere in this file makes tarpaulin discard **all** of it and fall
# back to the command line — silently, with one WARN line. The first symptom is
# a link failure in plugmem-napi, because the `exclude` below stopped applying.
timeout = "300s"
# plugmem-napi is excluded from the *build*, not just the metric: its
# `#[napi]` surface references N-API runtime symbols (`napi_*`) that are only
# provided by a Node process at load time. A normal `cargo test` links fine
# because the unused `#[napi]` items are dead-code-eliminated, but tarpaulin's
# instrumented, unoptimized build retains them, so linking its test binary
# fails with undefined `napi_*` references. The crate's pure logic (the
# skill-version gate) is covered by its own cargo tests; the `#[napi]` verbs
# are covered by the Node tests in `__test__/`, neither attributable by
# tarpaulin anyway (see `exclude-files` below).
#
# plugmem-py is excluded for a *different* reason, worth keeping separate so
# neither is loosened by accident. It links fine — libpython is present on any
# runner — so this is not a link failure like napi's. It is that instrumenting
# it buys nothing: the `#[pyclass]`/`#[pyfunction]` surface only executes
# inside a CPython process (pytest against a built wheel), which tarpaulin
# cannot attribute, and the crate also carries a `stub_gen` binary that is a
# code generator rather than shipped code. Its pure wrapper logic is covered by
# its own cargo tests through the rlib, in the `check` matrix.
exclude = ["plugmem-napi", "plugmem-py"]
out = ["Html", "Lcov", "Stdout"]
output-dir = "coverage"
exclude-files = [
    "crates/plugmem-cli/src/main.rs",
    "crates/plugmem-mcp/*",
    "crates/plugmem-napi/*",
    "crates/plugmem-py/*",
    "crates/*/tests/*",
    # The cross-runtime reproduction stand and its runner: measurement
    # tooling, not the library under test. The stand is exercised by
    # actually running the bench matrix (native + wasm runtimes), which
    # tarpaulin's ptrace engine cannot attribute anyway.
    "crates/*/examples/*",
    "tools/bench-matrix/*",
    # The chart renderer: measurement/reporting tooling with no unit tests
    # (its output is SVGs, verified by eye), same rationale as bench-matrix.
    "tools/bench-charts/*",
    # Cross-target equivalence probe (specs/14): CI tooling whose real run
    # happens inside wasm runtimes, outside tarpaulin's reach.
    "tools/wasm-probe/*",
    # Legacy reference sources: not a workspace member, never measured.
    "assets/references/*",
]
