[package]
name = "plugmem-wasm-probe"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Cross-target equivalence probe: one deterministic engine scenario, hashed; byte-identical snapshots on native, wasm32 and wasm64 prove the format is pointer-width independent."
