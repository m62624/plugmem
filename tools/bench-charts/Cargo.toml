[package]
name = "plugmem-bench-charts"
version = "0.1.0"
edition = "2024"
publish = false
description = "Renders the benchmark-matrix TSV into the README chart SVGs (plotters, pure Rust — no browser; log axis for order-of-magnitude metrics)."

[dependencies]
# Static SVG rendering, pure Rust (no browser/WebDriver). Used directly
# rather than through a wrapper so the allocation charts can use a true
# logarithmic y-axis (`(lo..hi).log_scale()`) — those values span five
# orders of magnitude and a linear axis collapses the small ones to a
# zero-height sliver.
#
# Font backend is `ttf` (font-kit). On Linux this needs the system
# `fontconfig` dev library at build time (the CI jobs that build this tool
# install `libfontconfig1-dev`; macOS/Windows use system fonts directly).
# `ab_glyph` would drop that dependency but ships no default font, so it
# panics with `FontUnavailable` unless a font blob is vendored and
# registered — not worth a binary in the repo for a dev chart tool.
plotters = { version = "0.3.7", default-features = false, features = [
    "svg_backend",
    "ttf",
] }
# The threshold config (config.toml). `toml::Table` parses via FromStr,
# so no serde derive is needed.
toml = "0.8"

[lints]
workspace = true
