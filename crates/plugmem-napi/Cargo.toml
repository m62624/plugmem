[package]
name = "plugmem-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native Node.js addon (napi-rs) for the plugmem engine: plugmem-host exposed in-process to Node/Deno/Bun; published to npm as `plugmem`."
# Published to npm (via @napi-rs/cli), not to crates.io.
publish = false

[lib]
# cdylib: the `.node` addon. rlib: so native `cargo test` can exercise the pure
# wrapper logic without a Node runtime.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The engine, embedded as-is (mmap, MVCC, locking, embedder). serde: results
# serialize straight to JS objects. config: the shared settings loader (used
# from N2 on for the embedder/engine config).
plugmem-host = { workspace = true, features = ["serde", "config"] }
# serde-json: lets `#[napi]` accept a JS object as `serde_json::Value` and
# return one, so the wrapper reuses the MCP arg-extraction/render path verbatim.
napi = { workspace = true, features = ["serde-json"] }
napi-derive = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }

[lints]
workspace = true

# A native addon shipped to npm, not a cargo-dist binary — excluded from releases.
[package.metadata.dist]
dist = false
