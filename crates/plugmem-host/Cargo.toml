[package]
name = "plugmem-host"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native host layer for plugmem: file storage with locking, Embedder trait and HTTP embedder implementations."
keywords = ["plugmem", "storage", "embedder", "memory", "llm"]
categories = ["filesystem", "api-bindings", "database"]

[dependencies]
plugmem-core = { workspace = true }
thiserror = { workspace = true }
memmap2 = { workspace = true }
self_cell = { workspace = true }
ureq = { workspace = true, features = ["json"] }
serde_json = { workspace = true }

[dev-dependencies]
# Cross-OS resident-set-size probe for the overlay RAM-win test (specs/16 §9).
memory-stats = { workspace = true }

[lints]
workspace = true

# A library / internal tool, not a shipped binary — excluded from cargo-dist releases.
[package.metadata.dist]
dist = false
