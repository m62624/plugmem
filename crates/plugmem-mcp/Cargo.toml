[package]
name = "plugmem-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "plugmem MCP server (stdio JSON-RPC)."
keywords = ["plugmem", "mcp", "memory", "llm", "ai"]
categories = ["command-line-utilities", "api-bindings", "database"]

[package.metadata.wix]
upgrade-guid = "058236C9-2C1D-4EC0-BF60-EEF4A5223E31"
path-guid = "154F9E0B-8C1E-4E0F-813A-15BB8FD4D290"
license = false
eula = false

[[bin]]
name = "plugmem-mcp"
path = "src/main.rs"

[dependencies]
# `serde` serializes result types straight to JSON; `config` shares the CLI's
# config.toml loader (Settings).
plugmem-host = { workspace = true, features = ["serde", "config"] }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
# The server reads its own `[server].workers` key from the shared config table.
toml = { workspace = true }

[lints]
workspace = true
