[package]
name = "plugmem-arena"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Flat byte-pool storage structures for plugmem: sharded sorted arena, blob heap, chunked lists, interner."
keywords = ["arena", "no-std", "storage", "interner", "wasm"]
categories = ["data-structures", "memory-management", "no-std", "embedded", "wasm"]

[dependencies]
thiserror = { workspace = true }
xxhash-rust = { workspace = true }
serde = { workspace = true, optional = true }

# Test/bench harnesses are native-only: proptest's transitive deps do not
# compile for wasm targets, and the wasm builds only need the library and
# the dependency-free bench_repro example.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "storage"
harness = false

[features]
# Deterministic work counters (perf gates); zero cost when disabled.
counters = []
# Optional serde Serialize/Deserialize on the public data types (ids, configs).
# Off by default; pulls in serde only when enabled.
serde = ["dep:serde"]

[lints]
workspace = true

# A library / internal tool, not a shipped binary — excluded from cargo-dist releases.
[package.metadata.dist]
dist = false
